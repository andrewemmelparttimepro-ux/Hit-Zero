<!-- Real Supabase client for AI Judge video upload + edge-function calls.
     Falls back to the HZdb in-browser mock when keys are absent. -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';
  const URL = 'https://ldhzkdqznccfgpdvqyfk.supabase.co';
  const ANON = 'sb_publishable_P2e2aHrrMYP85xBfncIilA_2435TVII';
  window.HZsupa = createClient(URL, ANON, {
    auth: {
      persistSession: true,
      detectSessionInUrl: true,
      autoRefreshToken: true,
      storage: window.localStorage,
      storageKey: 'hz.auth',
    },
    realtime: { params: { eventsPerSecond: 10 } },
    global: { headers: { 'x-client': 'hit-zero-pwa' } },
  });
  window.HZ_FN_BASE = URL;
  window.HZ_ANON_KEY = ANON;

  // ─── Mirror: pull real Supabase analyses into the in-browser HZdb so the
  // existing history + scorecard screens render them. The UI was built
  // against the mock store; this keeps the screens dumb while the real
  // backend drives the data. Safe to call repeatedly — it de-dupes by id.
  function upsert(bucket, row) {
    if (!row || !row.id) return;
    const arr = bucket;
    const i = arr.findIndex(x => x.id === row.id);
    if (i >= 0) arr[i] = row; else arr.push(row);
  }
  async function mirrorAnalysis(id) {
    const d = window.HZdb && window.HZdb._raw && window.HZdb._raw();
    if (!d || !window.HZsupa) return null;
    const s = window.HZsupa;
    const [a, els, dds, fb, su] = await Promise.all([
      s.from('routine_analyses').select('*').eq('id', id).maybeSingle(),
      s.from('analysis_elements').select('*').eq('analysis_id', id),
      s.from('analysis_deductions').select('*').eq('analysis_id', id),
      s.from('analysis_feedback').select('*').eq('analysis_id', id),
      s.from('analysis_skill_updates').select('*').eq('analysis_id', id),
    ]);
    if (a.error || !a.data) return null;
    d.routine_analyses = d.routine_analyses || [];
    d.analysis_elements = d.analysis_elements || [];
    d.analysis_deductions = d.analysis_deductions || [];
    d.analysis_feedback = d.analysis_feedback || [];
    d.analysis_skill_updates = d.analysis_skill_updates || [];
    upsert(d.routine_analyses, a.data);
    (els.data || []).forEach(r => upsert(d.analysis_elements, r));
    (dds.data || []).forEach(r => upsert(d.analysis_deductions, r));
    (fb.data || []).forEach(r => upsert(d.analysis_feedback, r));
    (su.data || []).forEach(r => upsert(d.analysis_skill_updates, r));
    // Re-snapshot so selectors see the new rows.
    if (window.HZsel && window.HZsel._refresh) await window.HZsel._refresh();
    return a.data;
  }
  async function mirrorRecent(teamId, n = 20) {
    if (!window.HZsupa || !teamId) return;
    const d = window.HZdb && window.HZdb._raw && window.HZdb._raw();
    const s = window.HZsupa;
    const { data } = await s.from('routine_analyses')
      .select('id').eq('team_id', teamId)
      .order('created_at', { ascending: false }).limit(n);
    if (!data) return;
    // Drop any stale local rows whose team_id doesn't match the live team —
    // otherwise the seeded "Senior Elite 4 L4" demo row lingers in history.
    if (d) {
      const keep = new Set(data.map(r => r.id));
      const filt = (arr) => (arr || []).filter(r => !r.team_id || r.team_id === teamId || keep.has(r.analysis_id) || keep.has(r.id));
      d.routine_analyses = (d.routine_analyses || []).filter(r => r.team_id === teamId);
      d.analysis_elements = filt(d.analysis_elements);
      d.analysis_deductions = filt(d.analysis_deductions);
      d.analysis_feedback = filt(d.analysis_feedback);
      d.analysis_skill_updates = filt(d.analysis_skill_updates);
    }
    for (const r of data) await mirrorAnalysis(r.id);
  }
  // Mirror the live team + athletes from Supabase. The HZdb mock seeds a
  // Senior Elite 4 team; if the real roster has been updated (e.g. Magic Minis
  // Mini L1), we overwrite the first team slot so every screen picks it up.
  async function mirrorRosterLive() {
    const d = window.HZdb && window.HZdb._raw && window.HZdb._raw();
    if (!d || !window.HZsupa) return;
    const s = window.HZsupa;
    const liveSession = window.HZdb?.auth?._getSession?.();
    const liveProfile = liveSession?.actualProfile || liveSession?.profile || null;
    const isLiveSession = liveSession?.mode === 'live';
    const placeholderProgramId = '11111111-1111-1111-1111-111111111111';
    const isPlaceholderProgramId = (id) => !id || id === placeholderProgramId;
    let activeProgramId = isPlaceholderProgramId(liveProfile?.program_id) ? null : liveProfile?.program_id || null;
    const activeRole = liveSession?.profile?.role || liveProfile?.role || null;
    const isStaff = activeRole === 'coach' || activeRole === 'owner';
    try { performance.mark('hz-live-hydration-start'); } catch {}
    const clearPrivateRows = () => {
      [
        'teams', 'athletes', 'athlete_skills', 'parent_links', 'billing_accounts', 'billing_charges',
        'attendance', 'sessions', 'session_availability', 'calendar_tokens', 'celebrations',
        'registration_windows', 'registrations', 'leads', 'lead_touches',
        'message_threads', 'thread_members', 'messages', 'message_reads', 'announcements',
        'waiver_templates', 'waiver_signatures', 'form_templates', 'form_fields', 'form_responses',
        'form_answers', 'emergency_contacts', 'medical_records', 'injuries',
        'uniforms', 'uniform_items', 'uniform_orders',
        'volunteer_roles', 'volunteer_assignments', 'drills', 'practice_plans', 'practice_plan_blocks',
        'pin_designs', 'athlete_pins', 'pin_drops', 'pin_quests',
        'program_join_requests', 'program_owner_applications', 'program_invites', 'program_invite_redemptions',
        'family_info_packets', 'class_enrollments', 'team_assignment_events',
        'routines', 'routine_sections', 'routine_audio_assets', 'music_licenses', 'routine_count_maps',
        'routine_events', 'routine_formations', 'routine_positions', 'routine_assignments',
        'routine_ai_suggestions', 'routine_exports', 'routine_versions', 'routine_comments',
        'routine_audio_analysis_jobs', 'routine_remix_requests', 'routine_music_compliance_checks',
        'routine_analyses', 'analysis_elements', 'analysis_deductions', 'analysis_feedback',
        'analysis_skill_updates',
      ].forEach(table => { d[table] = []; });
      d.profiles = liveProfile ? [liveProfile] : [];
    };

    // A retry for the same viewer must keep the last good in-memory data. Only
    // clear when the authenticated person actually changes.
    if (isLiveSession && d.__viewer_id !== liveProfile?.id) {
      clearPrivateRows();
      d.__viewer_id = liveProfile?.id || null;
    }

    let ownJoinRequests = [];
    let ownPackets = [];
    if (isLiveSession && !isStaff && liveProfile?.id) {
      const [joinRequests, packets] = await Promise.all([
        s.from('program_join_requests').select('*, programs(id, slug, public_name, name, city, state)').eq('profile_id', liveProfile.id).order('created_at', { ascending: false }),
        s.from('family_info_packets').select('*').eq('profile_id', liveProfile.id).order('updated_at', { ascending: false }),
      ]);
      ownJoinRequests = joinRequests.error ? (d.program_join_requests || []) : (joinRequests.data || []);
      ownPackets = packets.error ? (d.family_info_packets || []) : (packets.data || []);
      if (!joinRequests.error) d.program_join_requests = ownJoinRequests;
      if (!packets.error) d.family_info_packets = ownPackets;
      activeProgramId = [
        ...ownJoinRequests.map(row => row.program_id),
        ...ownPackets.map(row => row.program_id),
      ].find(id => !isPlaceholderProgramId(id)) || activeProgramId;
    }

    if (isLiveSession && isStaff && !activeProgramId) {
      if (window.HZsel && window.HZsel._refresh) await window.HZsel._refresh();
      return;
    }

    const programsQuery = s.from('programs').select('*').is('deleted_at', null).order('created_at');
    if (isLiveSession && activeProgramId) programsQuery.eq('id', activeProgramId);
    else if (isLiveSession && !isStaff) programsQuery.in('slug', ['mca', 'magic-city-athletics', 'magic-city-allstars']);
    const { data: programs, error: programsError } = await programsQuery;
    if (programsError) throw programsError;
    if (programs?.length) {
      d.programs = programs;
      const programIds = programs.map(p => p.id);
      // These collections only depend on programIds. Fetch them in one wave;
      // the old sequential groups added multiple network round trips to boot.
      const [paymentSettings, tracks, classes, windows, classEnrollments, waiverTemplates, formTemplates, announcements, uniforms, volunteerRoles, drills] = await Promise.all([
        s.from('program_payment_settings').select('*').in('program_id', programIds),
        s.from('program_tracks').select('*').in('program_id', programIds).order('display_order'),
        s.from('program_classes').select('*').in('program_id', programIds).order('display_order'),
        s.from('registration_windows').select('*').in('program_id', programIds).order('created_at', { ascending: false }),
        s.from('class_enrollments').select('*').in('program_id', programIds).order('created_at', { ascending: false }),
        isLiveSession ? s.from('waiver_templates').select('*').in('program_id', programIds).order('effective_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
        isLiveSession ? s.from('form_templates').select('*').in('program_id', programIds).order('created_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
        isLiveSession ? s.from('announcements').select('*').in('program_id', programIds).order('created_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
        isLiveSession ? s.from('uniforms').select('*').in('program_id', programIds).order('created_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
        isLiveSession ? s.from('volunteer_roles').select('*').in('program_id', programIds).order('created_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
        isLiveSession ? s.from('drills').select('*').in('program_id', programIds).order('created_at', { ascending: false }) : Promise.resolve({ data: [], error: null }),
      ]);
      // NEVER clobber local data with an errored (or unauthorized) query —
      // a transient failure here used to silently EMPTY the owner's feed,
      // uniforms, volunteer roles and drills until the next good mirror.
      if (!paymentSettings.error) d.program_payment_settings = paymentSettings.data || [];
      if (!tracks.error) d.program_tracks = tracks.data || [];
      if (!classes.error) d.program_classes = classes.data || [];
      if (!windows.error) d.registration_windows = windows.data || [];
      if (!classEnrollments.error) d.class_enrollments = classEnrollments.data || [];
      if (isLiveSession) {
        // Members-only tables: only meaningful with a real signed-in session.
        // In prototype / logged-out contexts these queries run as anon, get
        // nothing past RLS, and used to wipe the local demo data.
        if (!waiverTemplates.error) d.waiver_templates = waiverTemplates.data || [];
        if (!formTemplates.error) d.form_templates = formTemplates.data || [];
        if (!announcements.error) d.announcements = announcements.data || [];
        if (!uniforms.error) d.uniforms = uniforms.data || [];
        if (!volunteerRoles.error) d.volunteer_roles = volunteerRoles.data || [];
        if (!drills.error) d.drills = drills.data || [];
      }
      if (isLiveSession) {
        const formTemplateIds = (d.form_templates || []).map(row => row.id);
        const uniformIds = (d.uniforms || []).map(row => row.id);
        const [formFields, uniformItems] = await Promise.all([
          formTemplateIds.length ? s.from('form_fields').select('*').in('template_id', formTemplateIds).order('position') : Promise.resolve({ data: [], error: null }),
          uniformIds.length ? s.from('uniform_items').select('*').in('uniform_id', uniformIds) : Promise.resolve({ data: [], error: null }),
        ]);
        if (!formFields.error) d.form_fields = formFields.data || [];
        if (!uniformItems.error) d.uniform_items = uniformItems.data || [];
      }
      if (isStaff) {
        const [registrations, leads, leadTouches, packets, assignmentEvents] = await Promise.all([
          s.from('registrations').select('*').in('program_id', programIds).order('created_at', { ascending: false }),
          s.from('leads').select('*').in('program_id', programIds).order('created_at', { ascending: false }),
          s.from('lead_touches').select('*').order('created_at', { ascending: false }).limit(200),
          s.from('family_info_packets').select('*').in('program_id', programIds).order('updated_at', { ascending: false }),
          s.from('team_assignment_events').select('*').in('program_id', programIds).order('created_at', { ascending: false }).limit(100),
        ]);
        if (!registrations.error) d.registrations = registrations.data || [];
        if (!leads.error) d.leads = leads.data || [];
        const leadIds = new Set((d.leads || []).map(row => row.id));
        if (!leadTouches.error) d.lead_touches = (leadTouches.data || []).filter(row => leadIds.has(row.lead_id));
        if (!packets.error) d.family_info_packets = packets.data || [];
        if (!assignmentEvents.error) d.team_assignment_events = assignmentEvents.data || [];
      } else if (isLiveSession) {
        d.registrations = [];
        d.leads = [];
        d.lead_touches = [];
        d.program_join_requests = ownJoinRequests;
        d.family_info_packets = ownPackets;
      }
    }
    const teamsQuery = s.from('teams').select('*').is('deleted_at', null).order('created_at');
    if (isLiveSession && activeProgramId) teamsQuery.eq('program_id', activeProgramId);
    else if (isLiveSession && programs?.length) teamsQuery.in('program_id', programs.map(p => p.id));
    const { data: teams, error: teamsError } = await teamsQuery;
    if (teamsError) throw teamsError;
    if (!teams || !teams.length) {
      if (isLiveSession) {
        d.teams = [];
        d.athletes = [];
      }
      return;
    }
    d.teams = teams;
    const ids = teams.map(t => t.id);
    const profileQuery = activeRole === 'coach' || activeRole === 'owner'
      ? s.from('profiles').select('*').eq('program_id', activeProgramId).order('display_name')
      : null;
    const [athleteRows, profileRows] = await Promise.all([
      s.from('athletes').select('*').in('team_id', ids).is('deleted_at', null),
      profileQuery || Promise.resolve({ data: liveProfile ? [liveProfile] : [] }),
    ]);
    if (!athleteRows.error) d.athletes = athleteRows.data || [];
    if (!profileRows?.error && profileRows?.data?.length) d.profiles = profileRows.data;
    const aIds = (d.athletes || []).map(a => a.id);
    const sessionRows = await s.from('sessions').select('*').in('team_id', ids).order('scheduled_at');
    if (!sessionRows.error) d.sessions = (sessionRows.data || []).map(row => ({ ...row, scheduled: row.scheduled === false ? false : true }));
    const planRows = await s.from('practice_plans').select('*').in('team_id', ids).order('created_at', { ascending: false });
    if (!planRows.error) d.practice_plans = planRows.data || [];
    const planIds = (d.practice_plans || []).map(row => row.id);
    if (planIds.length) {
      const planBlocks = await s.from('practice_plan_blocks').select('*').in('plan_id', planIds).order('position');
      if (!planBlocks.error) d.practice_plan_blocks = planBlocks.data || [];
    } else {
      d.practice_plan_blocks = [];
    }
    const sessionIds = d.sessions.map(row => row.id);
    if (sessionIds.length) {
      const [availabilityRows, volunteerAssignments] = await Promise.all([
        s.from('session_availability').select('*').in('session_id', sessionIds),
        s.from('volunteer_assignments').select('*').in('session_id', sessionIds),
      ]);
      if (!availabilityRows.error) d.session_availability = availabilityRows.data || [];
      if (!volunteerAssignments.error) d.volunteer_assignments = volunteerAssignments.data || [];
      const celebrationRows = await s.from('celebrations').select('*').in('team_id', ids).order('created_at', { ascending: false });
      if (!celebrationRows.error) d.celebrations = celebrationRows.data || [];
    } else {
      d.session_availability = [];
      d.volunteer_assignments = [];
      d.celebrations = [];
    }
    // PostgREST caps every select at 1000 rows; athlete_skills and attendance
    // exceed that at real gym scale (athletes × skills / athletes × sessions),
    // and a single capped fetch silently drops the newest rows. Page through.
    async function fetchAllPages(makeQuery) {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const { data: page, error } = await makeQuery().range(from, from + 999);
        if (error) return { data: null, error };
        out.push(...(page || []));
        if ((page || []).length < 1000) break;
      }
      return { data: out, error: null };
    }
    if (aIds.length) {
      const [ask, pl, attendanceRows, billingRows, contactRows, medicalRows, injuryRows, waiverRows, uniformOrderRows, formResponseRows] = await Promise.all([
        fetchAllPages(() => s.from('athlete_skills').select('*').in('athlete_id', aIds).order('updated_at', { ascending: true })),
        s.from('parent_links').select('*').in('athlete_id', aIds),
        fetchAllPages(() => s.from('attendance').select('*').in('athlete_id', aIds).order('session_id', { ascending: true })),
        s.from('billing_accounts').select('*').in('athlete_id', aIds),
        s.from('emergency_contacts').select('*').in('athlete_id', aIds),
        s.from('medical_records').select('*').in('athlete_id', aIds),
        s.from('injuries').select('*').in('athlete_id', aIds),
        s.from('waiver_signatures').select('*').in('athlete_id', aIds),
        s.from('uniform_orders').select('*').in('athlete_id', aIds),
        s.from('form_responses').select('*').in('subject_athlete_id', aIds),
      ]);
      if (!ask.error) d.athlete_skills = ask.data || [];
      if (!pl.error) d.parent_links = pl.data || [];
      if (!attendanceRows.error) d.attendance = attendanceRows.data || [];
      if (!billingRows.error) d.billing_accounts = billingRows.data || [];
      if (!contactRows.error) d.emergency_contacts = contactRows.data || [];
      if (!medicalRows.error) d.medical_records = medicalRows.data || [];
      if (!injuryRows.error) d.injuries = injuryRows.data || [];
      if (!waiverRows.error) d.waiver_signatures = waiverRows.data || [];
      if (!uniformOrderRows.error) d.uniform_orders = uniformOrderRows.data || [];
      if (!formResponseRows.error) d.form_responses = formResponseRows.data || [];
      const formResponseIds = (d.form_responses || []).map(row => row.id);
      if (formResponseIds.length) {
        const answers = await s.from('form_answers').select('*').in('response_id', formResponseIds);
        if (!answers.error) d.form_answers = answers.data || [];
      } else {
        d.form_answers = [];
      }
      const accountIds = d.billing_accounts.map(row => row.id);
      if (accountIds.length) {
        const charges = await s.from('billing_charges').select('*').in('account_id', accountIds);
        if (!charges.error) d.billing_charges = charges.data || [];
      } else {
        d.billing_charges = [];
      }
    } else {
      d.athlete_skills = []; d.parent_links = []; d.attendance = []; d.billing_accounts = []; d.billing_charges = [];
      d.emergency_contacts = []; d.medical_records = []; d.injuries = []; d.waiver_signatures = []; d.uniform_orders = []; d.form_responses = []; d.form_answers = [];
    }
    // The dashboard can become useful before messaging/routine history finish.
    if (window.HZsel && window.HZsel._refresh) await window.HZsel._refresh();
    try { performance.mark('hz-live-core-ready'); } catch {}
    window.dispatchEvent(new CustomEvent('hz:refresh', { detail: { phase: 'core' } }));
    if (isLiveSession && liveProfile?.id) {
      const ownMemberships = await s.from('thread_members').select('*').eq('profile_id', liveProfile.id);
      const ownRows = ownMemberships.error ? (d.thread_members || []).filter(row => row.profile_id === liveProfile.id) : (ownMemberships.data || []);
      const threadIds = [...new Set(ownRows.map(row => row.thread_id).filter(Boolean))];
      if (threadIds.length) {
        const [threadRows, memberRows, messageRows, readRows] = await Promise.all([
          s.from('message_threads').select('*').in('id', threadIds).order('last_message_at', { ascending: false }),
          s.from('thread_members').select('*').in('thread_id', threadIds),
          s.from('messages').select('*').in('thread_id', threadIds).order('created_at', { ascending: true }),
          s.from('message_reads').select('*').eq('profile_id', liveProfile.id),
        ]);
        if (!threadRows.error) d.message_threads = threadRows.data || [];
        if (!memberRows.error) d.thread_members = memberRows.data || ownRows;
        if (!messageRows.error) d.messages = messageRows.data || [];
        if (!readRows.error) d.message_reads = readRows.data || [];
        const knownProfileIds = new Set((d.profiles || []).map(profile => profile.id));
        const memberProfileIds = [...new Set((d.thread_members || []).map(row => row.profile_id).filter(Boolean))].filter(id => !knownProfileIds.has(id));
        if (memberProfileIds.length) {
          const profileRows = await s.from('profiles').select('id, email, display_name, role, program_id').in('id', memberProfileIds);
          if (!profileRows.error && profileRows.data?.length) {
            d.profiles = [...(d.profiles || []), ...profileRows.data.filter(profile => !knownProfileIds.has(profile.id))];
          }
        }
      } else if (!ownMemberships.error) {
        d.message_threads = [];
        d.thread_members = [];
        d.messages = [];
        d.message_reads = [];
      }
    }
    const routineTables = [
      ['routine_audio_assets', 'routine_id'],
      ['music_licenses', 'routine_id'],
      ['routine_count_maps', 'routine_id'],
      ['routine_events', 'routine_id'],
      ['routine_assignments', 'routine_id'],
      ['routine_ai_suggestions', 'routine_id'],
      ['routine_exports', 'routine_id'],
      ['routine_versions', 'routine_id'],
      ['routine_comments', 'routine_id'],
      ['routine_audio_analysis_jobs', 'routine_id'],
      ['routine_remix_requests', 'routine_id'],
      ['routine_music_compliance_checks', 'routine_id'],
    ];
    const { data: routines, error: routinesError } = await s.from('routines').select('*').in('team_id', ids).order('created_at');
    if (routines?.length) {
      d.routines = routines;
      const routineIds = routines.map(r => r.id);
      const [sections, formations, ...routineRows] = await Promise.all([
        s.from('routine_sections').select('*').in('routine_id', routineIds).order('position'),
        s.from('routine_formations').select('*').in('routine_id', routineIds).order('start_count'),
        ...routineTables.map(([table, col]) => s.from(table).select('*').in(col, routineIds)),
      ]);
      if (!sections.error) d.routine_sections = sections.data || [];
      if (!formations.error) d.routine_formations = formations.data || [];
      routineRows.forEach((res, i) => {
        if (!res.error) d[routineTables[i][0]] = res.data || [];
      });
      const formationIds = d.routine_formations.map(f => f.id);
      if (formationIds.length) {
        const positions = await s.from('routine_positions').select('*').in('formation_id', formationIds);
        if (!positions.error) d.routine_positions = positions.data || [];
      } else {
        d.routine_positions = [];
      }
    } else if (isLiveSession && !routinesError) {
      [
        'routines', 'routine_sections', 'routine_audio_assets', 'music_licenses', 'routine_count_maps',
        'routine_events', 'routine_formations', 'routine_positions', 'routine_assignments',
        'routine_ai_suggestions', 'routine_exports', 'routine_versions', 'routine_comments',
        'routine_audio_analysis_jobs', 'routine_remix_requests', 'routine_music_compliance_checks',
      ].forEach(table => { d[table] = []; });
    }
    if (liveSession?.profile) upsert(d.profiles || (d.profiles = []), liveSession.profile);
    if (window.HZsel && window.HZsel._refresh) await window.HZsel._refresh();
    try { performance.mark('hz-live-hydrated'); } catch {}
    window.dispatchEvent(new CustomEvent('hz:refresh', { detail: { phase: 'complete' } }));
  }
  let rosterRefreshPromise = null;
  let rosterRefreshedAt = 0;
  function refreshRosterLive({ force = false } = {}) {
    if (rosterRefreshPromise) return rosterRefreshPromise;
    if (!force && Date.now() - rosterRefreshedAt < 15000) return Promise.resolve();
    rosterRefreshPromise = mirrorRosterLive()
      .then(() => { rosterRefreshedAt = Date.now(); })
      .finally(() => { rosterRefreshPromise = null; });
    return rosterRefreshPromise;
  }
  window.HZmirror = { analysis: mirrorAnalysis, recent: mirrorRecent, roster: mirrorRosterLive, refresh: refreshRosterLive };

  // Swallow drag-and-drop at the window level so a miss on the dropzone
  // doesn't make Chrome navigate to the file (which is what was creating
  // duplicate copies in Downloads).
  ['dragover','drop'].forEach(ev =>
    window.addEventListener(ev, (e) => { e.preventDefault(); }, { capture: true })
  );
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        const banner = document.getElementById('hz-update-ready');
        const apply = document.getElementById('hz-apply-update');
        const showUpdate = (worker) => {
          if (!worker || !banner || !apply) return;
          banner.hidden = false;
          apply.onclick = () => {
            window.__HZ_UPDATE_ACCEPTED = true;
            apply.disabled = true;
            apply.textContent = 'Updating…';
            worker.postMessage({ type: 'SKIP_WAITING' });
          };
        };
        if (reg.waiting) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdate(nw);
            }
          });
        });
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (window.__HZ_UPDATE_ACCEPTED) window.location.reload();
      });
    });
  }

  (function connectionStatus() {
    const banner = document.getElementById('hz-network-status');
    if (!banner) return;
    const render = () => {
      banner.hidden = navigator.onLine;
      banner.textContent = navigator.onLine ? '' : 'You are offline. Showing the last data loaded in this session; changes will not save until you reconnect.';
    };
    window.addEventListener('online', render);
    window.addEventListener('offline', render);
    render();
  })();
</script>
