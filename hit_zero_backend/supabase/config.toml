# Supabase CLI config — run `supabase start` in this folder
project_id = "hit-zero"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://thehitzero.net"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "https://thehitzero.net",
  "https://thehitzero.net/auth/callback",
  "https://hit-zero.vercel.app",
  "https://hit-zero.vercel.app/auth/callback",
  "https://hitzero.app",
  "https://hitzero.app/auth/callback",
  "capacitor://localhost",
  "hitzero://auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Family accounts remain private until staff approval or an invite. Requiring a
# second email-confirmation step was stranding parents after account creation,
# so email/password signup should return a session and continue to gym access.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "500MiB"        # cheer videos get large

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.public-intake-v1]
verify_jwt = false

[functions.square-checkout-v1]
verify_jwt = false

[functions.square-admin-v1]
verify_jwt = false

[functions.join-gym-v1]
verify_jwt = false

[functions.mca-calendar-v1]
verify_jwt = false
entrypoint = "../functions/mca-calendar-v1/index.ts"

[functions.calendar-ics]
verify_jwt = false
entrypoint = "../functions/calendar-ics/index.ts"
